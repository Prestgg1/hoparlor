    subdir: android/app
    gradle:
      - yes
    ndk: 28.2.13676358
    gradleprops:
      - hoparlor.abis=armeabi-v7a

  - versionName: 0.1.0
    versionCode: 12
    commit: v0.1.0
    subdir: android/app
    gradle:
      - yes
    ndk: 28.2.13676358
