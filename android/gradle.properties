org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# ABIs to build. Releases are built one ABI at a time (-Phoparlor.abis=arm64-v8a) so each
# gets its own versionCode; see app/build.gradle.kts.
hoparlor.abis=arm64-v8a,armeabi-v7a,x86_64
